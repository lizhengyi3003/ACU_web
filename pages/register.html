<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/login-register.css">
    <script src="../js/register.js"></script>
    <title>注册</title>
</head>
<body>
    <div id="container">
        <div id="register">
            <canvas id="particle-canvas"></canvas>
            <h1>注册</h1><br>
            <form id="collector">
                <div class="userinformation">
                    <label>创建用户名</label>
                    <input type="text" placeholder="选择独创用户名">
                </div><br>
                <div class="userinformation">
                    <label>邮箱</label>
                    <input type="text" placeholder="输入您的邮箱">
                </div><br>
                <div class="userinformation">
                    <label>设置密码</label>
                    <input type="text" placeholder="最小8位有效字符">
                </div><br>
                <button type="submit">成为新用户</button>
                <button id="loginbtn">已有账号?点我前往登录</button>
            </form>
        </div>
    </div>
</body>
<script src="../functions/particle.js"></script>
</html>
