<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>后台管理</title>
        <link rel="icon" href="/ACU_images/ACU_feichuan.ico" type="image/x-icon">
        <link rel="icon" href="/ACU_images/ACU_feichuan.png" type="image/png">
        <link rel="stylesheet" href="../ACU_assets/ACU_css/ACU_styles.css">
        <link rel="stylesheet" href="../ACU_assets/ACU_css/ACU_other/ACU_backManagement.css">
        <link rel="stylesheet" href="../ACU_assets/ACU_css/ACU_backManagement.css">
    </head>
    <body>
        <div class="ACU_background-video">
            <video autoplay loop muted>
                <source src="/ACU_videos/ACU_shenlilinghua.mp4" type="video/mp4">
            </video>
        </div>
        <div class="ACU_head">
            <div id="ACU_title">羽毛球社团后台管理系统</div>
            <span class="ACU_avatar">
                <img src="#" alt="用户头像" />
            </span>
        </div>
        <div class="ACU_nav">
            <div class="ACU_nav-cont"><img src="../ACU_assets/ACU_svgs/overview.svg" alt="总览">总览</div>
            <details>
                <summary class="ACU_nav-box"><img src="../ACU_assets/ACU_svgs/members.svg" alt="会员管理">会员管理</summary>
                <div class="ACU_nav-box-cont">会员列表</div>
                <div class="ACU_nav-box-cont">会员分组</div>
            </details>
            <div class="ACU_nav-cont"><img src="../ACU_assets/ACU_svgs/activities.svg" alt="活动管理">活动管理</div>
            <details>
                <summary class="ACU_nav-box"><img src="../ACU_assets/ACU_svgs/locations.svg" alt="场地管理">场地管理</summary>
                <div class="ACU_nav-box-cont">场地列表</div>
                <div class="ACU_nav-box-cont">场地预约</div>
                <div class="ACU_nav-box-cont">预约记录</div>
            </details>
            <div class="ACU_nav-cont"><img src="../ACU_assets/ACU_svgs/money.svg" alt="财务管理">财务管理</div>
            <div class="ACU_nav-cont"><img src="../ACU_assets/ACU_svgs/settings.svg" alt="系统管理">系统管理</div>
        </div>
        <div class="ACU_body">
            <div class="overview">
                <div class="ACU_body-box-row">
                    <div class="ACU_body-box">
                        <img src="../ACU_assets/ACU_svgs/members.svg" alt="注册会员">
                        <div class="ACU_body-box-num">#</div>
                        <div class="ACU_body-box-cont">注册会员</div>
                    </div>
                    <div class="ACU_body-box">
                        <img src="../ACU_assets/ACU_svgs/activities.svg" alt="本月活动">
                        <div class="ACU_body-box-num">#</div>
                        <div class="ACU_body-box-cont">本月活动</div>
                    </div>
                    <div class="ACU_body-box">
                        <img src="../ACU_assets/ACU_svgs/locations.svg" alt="场地预约">
                        <div class="ACU_body-box-num">#</div>
                        <div class="ACU_body-box-cont">场地预约</div>
                    </div>
                </div>
                <div class="ACU_body-activities">
                    <h3 class="ACU_body-title">最新活动</h3>
                    <div class="ACU_body-button">新增活动</div>
                    <div class="ACU_body-box2">
                        <div class="ACU_body-box2-cont">活动名称</div>
                        <div class="ACU_body-box2-cont">活动时间</div>
                        <div class="ACU_body-box2-cont">活动地点</div>
                        <div class="ACU_body-box2-cont">报名人数</div>
                        <div class="ACU_body-box2-cont">状态</div>
                        <div class="ACU_body-box2-cont">操作</div>
                    </div>
                </div>
                <div class="ACU_body-locations">
                    <h3 class="ACU_body-title">场地预约</h3>
                    <div class="ACU_body-button">新增预约</div>
                    <div class="ACU_body-box2">
                        <div class="ACU_body-box2-cont">场地编号</div>
                        <div class="ACU_body-box2-cont">预约日期</div>
                        <div class="ACU_body-box2-cont">时间段</div>
                        <div class="ACU_body-box2-cont">预约人</div>
                        <div class="ACU_body-box2-cont">状态</div>
                        <div class="ACU_body-box2-cont">操作</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
